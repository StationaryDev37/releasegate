name: ReleaseGate live traversal attestation
on:
  push:
    branches:
      - releasegate-live-traversal-2
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Create deterministic traversal artifact
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'ReleaseGate live traversal artifact v1' > traversal-artifact.txt
          sha256sum traversal-artifact.txt

      - name: Attest traversal artifact
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: traversal-artifact.txt

      - name: Upload traversal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: releasegate-live-traversal-artifact
          path: traversal-artifact.txt
          retention-days: 14
