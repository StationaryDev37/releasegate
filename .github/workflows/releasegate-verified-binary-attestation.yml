name: ReleaseGate verified binary attestation

on:
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  attest:
    name: Attest authoritative ReleaseGate binary
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download authoritative gate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh release download v0.5-production-gate2-20261008 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern releasegate-v0.5-production-x86_64-linux \
            --dir artifact
          BIN="artifact/releasegate-v0.5-production-x86_64-linux"
          test -f "$BIN"
          test "$(sha256sum "$BIN" | awk '{print $1}')" = "6dab6c54f5feeacc5a50be05a8dd269257a771e2c0b6b55c3a9e36e96974b548"
          cp "$BIN" verified-releasegate
          chmod 0755 verified-releasegate
          sha256sum verified-releasegate

      - name: Attest verified binary
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: verified-releasegate
